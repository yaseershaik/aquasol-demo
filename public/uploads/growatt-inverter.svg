<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="invBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#F8FAFC"/>
  <!-- Inverter Chassis -->
  <rect x="180" y="60" width="240" height="280" rx="20" fill="url(#invBody)" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Status Screen OLED -->
  <rect x="230" y="100" width="140" height="60" rx="8" fill="#0A192F" stroke="#334155" stroke-width="2"/>
  <circle cx="250" cy="130" r="4" fill="#22C55E"/>
  <text x="300" y="135" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle">5.00 kW OK</text>
  <!-- Brand Plate -->
  <rect x="230" y="190" width="140" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="300" y="208" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#D97706" text-anchor="middle">GROWATT</text>
  <!-- Heatsink Fins (Bottom) -->
  <rect x="200" y="290" width="200" height="30" rx="4" fill="#334155"/>
  <line x1="220" y1="290" x2="220" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="240" y1="290" x2="240" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="260" y1="290" x2="260" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="280" y1="290" x2="280" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="300" y1="290" x2="300" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="320" y1="290" x2="320" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="340" y1="290" x2="340" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="360" y1="290" x2="360" y2="320" stroke="#64748B" stroke-width="2"/>
  <line x1="380" y1="290" x2="380" y2="320" stroke="#64748B" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ssMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="motorBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#F8FAFC"/>
  <!-- Base Flange -->
  <rect x="230" y="320" width="140" height="40" rx="6" fill="#475569" stroke="#334155" stroke-width="2"/>
  <circle cx="250" cy="340" r="12" fill="#CBD5E1"/>
  <circle cx="350" cy="340" r="12" fill="#CBD5E1"/>
  <!-- SS Multistage Chamber Chamber Column -->
  <rect x="260" y="160" width="80" height="160" rx="4" fill="url(#ssMetal)" stroke="#64748B" stroke-width="2"/>
  <!-- Chamber Rings -->
  <line x1="260" y1="190" x2="340" y2="190" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="220" x2="340" y2="220" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="250" x2="340" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="280" x2="340" y2="280" stroke="#475569" stroke-width="2"/>
  <!-- Motor Stator Top -->
  <rect x="245" y="60" width="110" height="100" rx="8" fill="url(#motorBlue)" stroke="#334155" stroke-width="2"/>
  <!-- Terminal Box -->
  <rect x="345" y="80" width="30" height="40" rx="4" fill="#D97706"/>
  <!-- Brand Label -->
  <rect x="255" y="95" width="90" height="30" rx="4" fill="#FFFFFF"/>
  <text x="300" y="115" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#0284C7" text-anchor="middle">GRUNDFOS</text>
</svg>

  <text x="300" y="195" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0F172A" text-anchor="middle">DOW FILMTEC™</text>
  <text x="300" y="220" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0284C7" text-anchor="middle">BW30-4040 RO ELEMENT</text>

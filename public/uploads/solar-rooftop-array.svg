<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="solarCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#F8FAFC"/>
  <!-- Aluminum Frame Outer -->
  <rect x="140" y="50" width="320" height="300" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/>
  <!-- Glass Surface Grid -->
  <rect x="152" y="62" width="296" height="276" rx="4" fill="url(#solarCell)"/>
  <!-- Busbars and Grid lines -->
  <line x1="200" y1="62" x2="200" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="62" x2="250" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="62" x2="300" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="350" y1="62" x2="350" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="62" x2="400" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="152" y1="131" x2="448" y2="131" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <line x1="152" y1="200" x2="448" y2="200" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <line x1="152" y1="269" x2="448" y2="269" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <!-- Solar Glow Refraction Arc -->
  <circle cx="410" cy="90" r="14" fill="#F59E0B" opacity="0.8"/>
</svg>
